<!-- checkout.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Foodies - Checkout</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        .checkout-page { padding: 120px 24px 60px; display: flex; gap: 40px; }
        .checkout-form { flex: 2; background: var(--surface-color); padding: 32px; border-radius: var(--radius-lg); border: 1px solid var(--border-color); box-shadow: var(--shadow-sm); }
        .checkout-summary { flex: 1; align-self: flex-start; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 500; }
        .form-group input { width: 100%; padding: 12px; border: 2px solid var(--border-color); border-radius: var(--radius-sm); font-family: inherit; font-size: 1rem; background: var(--bg-color); color: var(--text-primary); }
        .form-group input:focus { border-color: var(--primary-color); outline: none; }
        .payment-options { display: flex; gap: 16px; margin-bottom: 24px; }
        .payment-card { flex: 1; padding: 16px; border: 2px solid var(--border-color); border-radius: var(--radius-md); text-align: center; cursor: pointer; transition: all 0.2s; font-weight: 600; }
        .payment-card.selected { border-color: var(--primary-color); background: rgba(255, 126, 95, 0.1); color: var(--primary-color); }
        @media(max-width: 900px) { .checkout-page { flex-direction: column; } }
    </style>
</head>
<body>
    <script>if (localStorage.getItem('theme') === 'dark') document.documentElement.setAttribute('data-theme', 'dark');</script>
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo"><i class="fa-solid fa-burger"></i> Foodies</a>
            <ul class="nav-links">
                <li><a href="restaurants.html">Restaurants</a></li>
                <li><a href="offers.html">Offers</a></li>
                <li><a href="help.html">Help</a></li>
            </ul>
        </div>
    </nav>

    <div class="container checkout-page">
        <div class="checkout-form">
            <h2>Delivery Details</h2>
            <p style="color: var(--text-secondary); margin-bottom: 24px;">Enter your information accurately so we can deliver your food hot!</p>
            
            <form id="checkoutForm" onsubmit="handleCheckout(event)">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" id="chkName" placeholder="John Doe" required>
                </div>
                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="tel" id="chkPhone" placeholder="9876543210" pattern="[0-9]{10}" required>
                </div>
                <div class="form-group">
                    <label>Delivery Address</label>
                    <input type="text" id="chkAddress" placeholder="House/Flat No., Street, Area" required>
                </div>
                <div style="display: flex; gap: 16px;">
                    <div class="form-group" style="flex:1;">
                        <label>City</label>
                        <input type="text" id="chkCity" placeholder="New Delhi" required value="New Delhi">
                    </div>
                    <div class="form-group" style="flex:1;">
                        <label>Pincode</label>
                        <input type="text" id="chkPincode" placeholder="110001" required>
                    </div>
                </div>

                <h3 style="margin: 24px 0 16px;">Payment Method</h3>
                <div class="payment-options">
                    <div class="payment-card selected" onclick="selectPayment(this, 'cash')">
                        <i class="fa-solid fa-money-bill-1-wave" style="display:block; font-size:1.5rem; margin-bottom:8px;"></i> Cash
                    </div>
                    <div class="payment-card" onclick="selectPayment(this, 'upi')">
                        <i class="fa-brands fa-google-pay" style="display:block; font-size:1.5rem; margin-bottom:8px;"></i> UPI
                    </div>
                    <div class="payment-card" onclick="selectPayment(this, 'card')">
                        <i class="fa-solid fa-credit-card" style="display:block; font-size:1.5rem; margin-bottom:8px;"></i> Card
                    </div>
                </div>

                <!-- UPI Details -->
                <div id="upiDetails" style="display: none; margin-bottom: 24px; padding: 16px; border: 1px solid var(--border-color); border-radius: var(--radius-sm); background: rgba(0,0,0,0.02);">
                    <div class="form-group">
                        <label>UPI ID</label>
                        <input type="text" id="chkUpiId" placeholder="username@upi">
                    </div>
                </div>

                <!-- Card Details -->
                <div id="cardDetails" style="display: none; margin-bottom: 24px; padding: 16px; border: 1px solid var(--border-color); border-radius: var(--radius-sm); background: rgba(0,0,0,0.02);">
                    <!-- Saved Card Option -->
                    <div id="savedCardSelectionContainer" style="margin-bottom: 16px; display: none;">
                        <label style="display: flex; align-items: center; gap: 8px; font-weight: 600; cursor: pointer; margin-bottom: 12px;">
                            <input type="checkbox" id="useSavedCardCheckbox" onchange="toggleCardInputs()" style="width: auto;">
                            Use a saved payment method
                        </label>
                        <select id="savedCardSelect" style="width: 100%; padding: 12px; border: 2px solid var(--border-color); border-radius: var(--radius-sm); background: var(--bg-color); color: var(--text-primary); font-family: inherit; font-size: 1rem; margin-bottom: 16px;">
                            <!-- Dynamically loaded options -->
                        </select>
                    </div>

                    <!-- Card Inputs -->
                    <div id="newCardInputs">
                        <div class="form-group">
                            <label>Card Number</label>
                            <input type="text" id="chkCardNum" placeholder="0000 0000 0000 0000" maxlength="19" oninput="formatCheckoutCardNumber(this)">
                        </div>
                        <div style="display: flex; gap: 16px;">
                            <div class="form-group" style="flex:1;">
                                <label>Expiry (MM/YY)</label>
                                <input type="text" id="chkCardExp" placeholder="MM/YY" maxlength="5" oninput="formatCheckoutExpiry(this)">
                            </div>
                            <div class="form-group" style="flex:1;">
                                <label>CVV</label>
                                <input type="password" id="chkCardCvv" placeholder="123" maxlength="4">
                            </div>
                        </div>
                        <div class="form-group">
                            <label>Name on Card</label>
                            <input type="text" id="chkCardName" placeholder="Write Your Name">
                        </div>
                        <div class="form-group" style="display: flex; align-items: center; gap: 8px; margin-top: 12px;">
                            <input type="checkbox" id="saveCardCheckbox" style="width: auto; cursor: pointer;">
                            <label for="saveCardCheckbox" style="margin: 0; font-weight: 500; cursor: pointer;">Save this card for future payments</label>
                        </div>
                    </div>
                </div>
                
                <input type="hidden" id="selectedPaymentMethod" value="cash">

                <button type="submit" class="btn btn-primary btn-block" style="font-size: 1.2rem; padding: 16px;">Pay & Place Order</button>
            </form>
        </div>

        <div class="checkout-summary">
            <div class="cart-summary" style="background: var(--surface-color); border-radius: var(--radius-lg); padding: 32px; border: 1px solid var(--border-color);">
                <h3 style="margin-bottom: 24px;">Order Summary</h3>
                <div id="checkoutItems" style="margin-bottom: 16px; font-size: 0.95rem; color: var(--text-secondary);">
                    <!-- Items snippet -->
                </div>
                <div style="display:flex; gap:8px; margin-bottom:16px;">
                    <input type="text" id="chkCouponInput" placeholder="Enter Coupon Code" style="flex:1; padding:8px 12px; border:1px solid var(--border-color); border-radius:var(--radius-sm);">
                    <button type="button" class="btn btn-outline" style="padding:8px 16px;" onclick="applyChkCoupon()">Apply</button>
                </div>
                <div id="chkAppliedCouponMsg" style="color:var(--success-color); font-size:0.9rem; margin-bottom:16px; display:none;">
                    <i class="fa-solid fa-tags"></i> Coupon <strong id="chkAppliedCouponName"></strong> Applied! 
                    <button type="button" onclick="removeChkCoupon()" style="background:none; border:none; color:var(--danger-color); cursor:pointer; text-decoration:underline;">Remove</button>
                </div>
                
                <div style="display: flex; justify-content: space-between; border-top: 1px dashed var(--border-color); padding-top: 16px; margin-top: 16px; font-size: 1.0rem; color: var(--text-secondary);">
                    <span>Subtotal</span>
                    <span id="chkSubtotal">₹0</span>
                </div>
                <div style="display: flex; justify-content: space-between; margin-top: 8px; font-size: 1.0rem; color: var(--text-secondary);">
                    <span>Fees (Delivery + Platform)</span>
                    <span>₹45</span>
                </div>
                <div id="chkDiscountRow" style="display: none; justify-content: space-between; margin-top: 8px; font-size: 1.0rem; color: var(--success-color);">
                    <span>Discount</span>
                    <span id="chkDiscountAmount">-₹0</span>
                </div>
                <div style="display: flex; justify-content: space-between; border-top: 1px dashed var(--border-color); padding-top: 16px; margin-top: 16px; font-size: 1.25rem; font-weight: 700;">
                    <span>Total</span>
                    <span id="finalTotal">₹0</span>
                </div>
            </div>
        </div>
    </div>
    
    <div id="toastContainer" class="toast-container"></div>
    <script src="js/auth.js"></script>
    <script src="js/script.js"></script>
    <script src="js/cart.js"></script>
    <script>
        function updateSummary() {
            const container = document.getElementById('checkoutItems');
            if(window.cartSystem.items.length === 0) {
                container.innerHTML = '<p style="color:var(--danger-color);">Your cart is empty.</p>';
                document.getElementById('finalTotal').textContent = '₹0';
                return;
            }
            let html = '';
            for (const item of cartSystem.items) {
                html += `<div style="display:flex; justify-content:space-between; margin-bottom:8px;"><span>${item.quantity}x ${item.name}</span><span>₹${item.price * item.quantity}</span></div>`;
            }
            container.innerHTML = html;
            
            const sub = cartSystem.getTotal();
            document.getElementById('chkSubtotal').textContent = `₹${sub}`;
            document.getElementById('finalTotal').textContent = `₹${cartSystem.getFinalTotal()}`;
            
            const discountRow = document.getElementById('chkDiscountRow');
            if(cartSystem.appliedCoupon && cartSystem.discountAmount > 0) {
                discountRow.style.display = 'flex';
                document.getElementById('chkAppliedCouponName').textContent = cartSystem.appliedCoupon;
                document.getElementById('chkDiscountAmount').textContent = `-₹${cartSystem.discountAmount}`;
                document.getElementById('chkAppliedCouponMsg').style.display = 'block';
            } else {
                discountRow.style.display = 'none';
                document.getElementById('chkAppliedCouponMsg').style.display = 'none';
            }
        }
        
        function applyChkCoupon() {
            const code = document.getElementById('chkCouponInput').value;
            if(cartSystem.applyCoupon(code)) {
                document.getElementById('chkCouponInput').value = '';
                updateSummary();
            }
        }
        
        function removeChkCoupon() {
            cartSystem.removeCoupon();
            updateSummary();
        }

        function formatCheckoutCardNumber(input) {
            let value = input.value.replace(/\D/g, '');
            let formatted = '';
            for (let i = 0; i < value.length; i++) {
                if (i > 0 && i % 4 === 0) formatted += ' ';
                formatted += value[i];
            }
            input.value = formatted;
        }

        function formatCheckoutExpiry(input) {
            let value = input.value.replace(/\D/g, '');
            if (value.length > 2) {
                input.value = value.slice(0, 2) + '/' + value.slice(2, 4);
            } else {
                input.value = value;
            }
        }

        function setupSavedPayments() {
            const container = document.getElementById('savedCardSelectionContainer');
            const select = document.getElementById('savedCardSelect');
            if (!window.profileSystem || !container || !select) return;
            
            const payments = window.profileSystem.payments || [];
            if (payments.length > 0) {
                container.style.display = 'block';
                document.getElementById('useSavedCardCheckbox').checked = true;
                
                let selectHtml = '';
                payments.forEach((p) => {
                    selectHtml += `<option value="${p.id}" data-type="${p.type}" data-detail="${p.detail}">${p.type} ending in ${p.detail.slice(-4)}</option>`;
                });
                select.innerHTML = selectHtml;
                toggleCardInputs();
            } else {
                container.style.display = 'none';
                document.getElementById('useSavedCardCheckbox').checked = false;
                toggleCardInputs();
            }
        }

        function toggleCardInputs() {
            const useSaved = document.getElementById('useSavedCardCheckbox').checked;
            const newCardDiv = document.getElementById('newCardInputs');
            
            const numInput = document.getElementById('chkCardNum');
            const expInput = document.getElementById('chkCardExp');
            const cvvInput = document.getElementById('chkCardCvv');
            const nameInput = document.getElementById('chkCardName');
            
            if (useSaved && document.getElementById('savedCardSelectionContainer').style.display !== 'none') {
                newCardDiv.style.display = 'none';
                numInput.required = false;
                expInput.required = false;
                cvvInput.required = false;
                nameInput.required = false;
            } else {
                newCardDiv.style.display = 'block';
                const isCardMethod = document.getElementById('selectedPaymentMethod').value === 'card';
                numInput.required = isCardMethod;
                expInput.required = isCardMethod;
                cvvInput.required = isCardMethod;
                nameInput.required = isCardMethod;
            }
        }

        function selectPayment(el, method) {
            const cards = document.querySelectorAll('.payment-card');
            for(const c of cards) {
                c.classList.remove('selected');
            }
            el.classList.add('selected');
            document.getElementById('selectedPaymentMethod').value = method;

            document.getElementById('upiDetails').style.display = method === 'upi' ? 'block' : 'none';
            document.getElementById('cardDetails').style.display = method === 'card' ? 'block' : 'none';

            document.getElementById('chkUpiId').required = method === 'upi';
            
            toggleCardInputs();
        }

        function handleCheckout(e) {
            e.preventDefault();
            if(!authSystem.isLoggedIn()) {
                window.location.href = 'login.html?redirect=checkout.html';
                return;
            }
            if(cartSystem.items.length === 0) {
                showToast("Cannot place empty order!");
                return;
            }

            const method = document.getElementById('selectedPaymentMethod').value;
            if (method === 'card') {
                const useSaved = document.getElementById('useSavedCardCheckbox').checked && 
                                 document.getElementById('savedCardSelectionContainer').style.display !== 'none';
                
                if (!useSaved) {
                    const cardNum = document.getElementById('chkCardNum').value.replace(/\s+/g, '');
                    const cardExp = document.getElementById('chkCardExp').value;
                    const cardCvv = document.getElementById('chkCardCvv').value;
                    const cardName = document.getElementById('chkCardName').value.trim();
                    
                    if (cardNum.length < 16) {
                        showToast("Please enter a valid 16-digit card number.");
                        return;
                    }
                    if (!cardExp.includes('/') || cardExp.length < 5) {
                        showToast("Please enter a valid expiry (MM/YY).");
                        return;
                    }
                    if (cardCvv.length < 3) {
                        showToast("Please enter a valid CVV.");
                        return;
                    }
                    if (!cardName) {
                        showToast("Please enter name on card.");
                        return;
                    }
                    
                    // If "Save Card" is checked, save it to profileSystem
                    if (document.getElementById('saveCardCheckbox').checked && window.profileSystem) {
                        let type = 'Visa';
                        if (cardNum.startsWith('5')) type = 'Mastercard';
                        else if (cardNum.startsWith('4')) type = 'Visa';
                        else if (cardNum.startsWith('3')) type = 'American Express';
                        window.profileSystem.addPayment(type, cardNum);
                    }
                }
            }

            // Save Order
            cartSystem.saveOrder();
            // Clear cart
            cartSystem.clearCart();
            // Redirect
            window.location.href = 'confirmation.html';
        }

        document.addEventListener('DOMContentLoaded', () => {
            if(!authSystem.isLoggedIn()) {
                window.location.href = 'login.html?redirect=checkout.html';
                return;
            } else {
                const user = authSystem.getUser();
                document.getElementById('chkName').value = user.name;
                document.getElementById('chkPhone').value = user.phone;
                document.getElementById('chkAddress').value = user.address;
                document.getElementById('chkPincode').value = user.pincode;
            }
            updateSummary();
            setupSavedPayments();
        });
    </script>
</body>
</html>
